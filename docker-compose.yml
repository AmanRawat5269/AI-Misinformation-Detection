version: "3.9"

services:
  backend:
    image: verifact-ai-backend
    container_name: verifact-backend
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    image: verifact-ai-frontend
    container_name: verifact-frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend