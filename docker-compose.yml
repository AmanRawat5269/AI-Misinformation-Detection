
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: verifact-ai-backend
    container_name: verifact-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  frontend:
    build:
      context: ./misinfo-frontend-js
      dockerfile: Dockerfile
    container_name: verifact-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_CHECK_PATH: /predict
    depends_on:
      backend:
        condition: service_healthy
